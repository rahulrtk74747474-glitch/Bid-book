name: Temporary Professional Trust Windows APK Builder

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  build-phone-apk-windows:
    if: startsWith(github.head_ref, 'professional-trust-phone-test')
    runs-on: windows-latest
    timeout-minutes: 300
    env:
      ENVIRONMENT: development
      DATABASE_URL: sqlite+aiosqlite:///C:/Windows/Temp/bidbook-phone-test.db
      JWT_SECRET: temporary-phone-test-secret-only-never-production-12345678901234567890
      OTP_PEPPER: temporary-phone-test-otp-pepper-never-production-1234567890
      EXPOSE_DEVELOPMENT_OTP: "true"
      AUTO_CREATE_TABLES: "true"
      OTP_COOLDOWN_SECONDS: "0"
      OTP_HOURLY_LIMIT: "100"
      PLATFORM_FEE_BPS: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Start BidBook test backend
        shell: pwsh
        run: |
          Set-Location backend
          python -m pip install -e ".[dev]" aiosqlite
          $p = Start-Process python -ArgumentList '-m','uvicorn','app.main:app','--host','127.0.0.1','--port','8000' -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\api-out.log" -RedirectStandardError "$env:RUNNER_TEMP\api-err.log"
          Set-Location ..
          $ok = $false
          for ($i=0; $i -lt 60; $i++) {
            try { Invoke-RestMethod -Uri 'http://127.0.0.1:8000/health' -TimeoutSec 2 | Out-Null; $ok=$true; break } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $ok) { Get-Content "$env:RUNNER_TEMP\api-out.log" -ErrorAction SilentlyContinue; Get-Content "$env:RUNNER_TEMP\api-err.log" -ErrorAction SilentlyContinue; exit 1 }

      - name: Seed Professional Trust demo data
        shell: pwsh
        run: |
          $api='http://127.0.0.1:8000/v1'
          function Login([string]$phone) {
            $r=Invoke-RestMethod -Method Post -Uri "$api/auth/otp/request" -ContentType 'application/json' -Body (@{phone=$phone}|ConvertTo-Json -Compress)
            $v=Invoke-RestMethod -Method Post -Uri "$api/auth/otp/verify" -ContentType 'application/json' -Body (@{challenge_id=$r.challenge_id;otp=$r.development_otp;device_id='seed'}|ConvertTo-Json -Compress)
            return $v.access_token
          }
          function H([string]$token) { return @{Authorization="Bearer $token"} }
          $customer=Login '9876505501'; $p1=Login '9876505502'; $p2=Login '9876505503'
          Invoke-RestMethod -Method Put -Uri "$api/providers/me" -Headers (H $p1) -ContentType 'application/json' -Body (@{kind='individual';display_name='Sharma AC Care';service_area='Sonipat';bio='Trusted AC repair and servicing.'}|ConvertTo-Json -Compress) | Out-Null
          Invoke-RestMethod -Method Put -Uri "$api/providers/me" -Headers (H $p2) -ContentType 'application/json' -Body (@{kind='company';display_name='SparkSafe Electricals';service_area='Sonipat';bio='Professional electrical service team.'}|ConvertTo-Json -Compress) | Out-Null
          Invoke-RestMethod -Method Post -Uri "$api/services" -Headers (H $p1) -ContentType 'application/json' -Body (@{title='Split AC Deep Service';category='AC Service';description='Indoor and outdoor unit cleaning with performance check.';area='Sonipat';price_paise=59900;pricing_unit='fixed'}|ConvertTo-Json -Compress) | Out-Null
          Invoke-RestMethod -Method Post -Uri "$api/services" -Headers (H $p2) -ContentType 'application/json' -Body (@{title='Home Electrician Visit';category='Electrician';description='Diagnosis and minor electrical repair visit.';area='Sonipat';price_paise=39900;pricing_unit='fixed'}|ConvertTo-Json -Compress) | Out-Null
          $req=Invoke-RestMethod -Method Post -Uri "$api/requests" -Headers (H $customer) -ContentType 'application/json' -Body (@{title='AC not cooling properly';category='AC Service';description='1.5 ton split AC runs but is not cooling. Need diagnosis and service.';area='Sector 15, Sonipat';requested_for='2026-08-30T10:00:00Z'}|ConvertTo-Json -Compress)
          Invoke-RestMethod -Method Post -Uri "$api/requests/$($req.id)/bids" -Headers (H $p1) -ContentType 'application/json' -Body (@{amount_paise=90000;note='Initial bid'}|ConvertTo-Json -Compress) | Out-Null
          Invoke-RestMethod -Method Post -Uri "$api/requests/$($req.id)/bids" -Headers (H $p1) -ContentType 'application/json' -Body (@{amount_paise=74900;note='Revised bid'}|ConvertTo-Json -Compress) | Out-Null
          Invoke-RestMethod -Method Post -Uri "$api/requests/$($req.id)/bids" -Headers (H $p2) -ContentType 'application/json' -Body (@{amount_paise=82000;note='Diagnosis included'}|ConvertTo-Json -Compress) | Out-Null

      - name: Open temporary HTTPS backend
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe' -OutFile cloudflared.exe
          $p=Start-Process .\cloudflared.exe -ArgumentList 'tunnel','--url','http://127.0.0.1:8000','--no-autoupdate' -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\tunnel-out.log" -RedirectStandardError "$env:RUNNER_TEMP\tunnel-err.log"
          $url=$null
          for ($i=0; $i -lt 90; $i++) {
            $text=((Get-Content "$env:RUNNER_TEMP\tunnel-out.log" -Raw -ErrorAction SilentlyContinue) + "`n" + (Get-Content "$env:RUNNER_TEMP\tunnel-err.log" -Raw -ErrorAction SilentlyContinue))
            $m=[regex]::Match($text,'https://[a-z0-9-]+\.trycloudflare\.com')
            if ($m.Success) { $url=$m.Value; break }
            Start-Sleep -Seconds 1
          }
          if (-not $url) { Get-Content "$env:RUNNER_TEMP\tunnel-err.log" -ErrorAction SilentlyContinue; exit 1 }
          "PUBLIC_URL=$url" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $ok=$false
          for ($i=0; $i -lt 30; $i++) { try { Invoke-RestMethod -Uri "$url/health" -TimeoutSec 4 | Out-Null; $ok=$true; break } catch { Start-Sleep -Seconds 2 } }
          if (-not $ok) { exit 1 }

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Android APK
        shell: pwsh
        run: |
          flutter create . --platforms=android --org com.bidbook --project-name bid_book
          Remove-Item test\widget_test.dart -ErrorAction SilentlyContinue
          flutter pub get
          flutter analyze
          flutter build apk --release "--dart-define=BIDBOOK_API_BASE_URL=$env:PUBLIC_URL"
          Copy-Item build\app\outputs\flutter-apk\app-release.apk BidBook-Professional-Trust-Test.apk
          Get-Item BidBook-Professional-Trust-Test.apk | Format-List Name,Length

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: BidBook-Professional-Trust-Test-APK-Windows
          path: BidBook-Professional-Trust-Test.apk
          retention-days: 1
          if-no-files-found: error

      - name: Keep backend online for phone testing
        shell: pwsh
        run: |
          Write-Host "Temporary API: $env:PUBLIC_URL"
          for ($i=0; $i -lt 48; $i++) { Start-Sleep -Seconds 300; try { Invoke-RestMethod -Uri "$env:PUBLIC_URL/health" -TimeoutSec 5 | Out-Null } catch {} }
