[project]
name = "bidbook-api"
version = "0.3.0"
description = "Secure backend API for Bid&Book"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]>=0.35,<1",
  "SQLAlchemy[asyncio]==2.0.52",
  "asyncpg>=0.29,<1",
  "PyJWT[crypto]==2.13.0",
  "pwdlib[argon2]==0.3.1",
  "google-auth==2.56.3",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501", "B008"]
