services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bidbook}
      POSTGRES_USER: ${POSTGRES_USER:-bidbook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
    volumes:
      - bidbook_pg:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bidbook} -d ${POSTGRES_DB:-bidbook}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [private]

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - bidbook_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]

  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bidbook}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bidbook}
      REDIS_URL: redis://redis:6379/0
      AUTO_CREATE_TABLES: "false"
      EXPOSE_DEVELOPMENT_OTP: "false"
      TRUST_PROXY_HEADERS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - ${FIREBASE_CREDENTIALS_HOST_PATH:-./secrets/firebase-service-account.json}:/run/secrets/firebase-service-account.json:ro
    networks: [private, edge]

  push-worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.push_worker"]
    env_file:
      - .env.production
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bidbook}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bidbook}
      REDIS_URL: redis://redis:6379/0
      FIREBASE_CREDENTIALS_FILE: /run/secrets/firebase-service-account.json
      AUTO_CREATE_TABLES: "false"
      EXPOSE_DEVELOPMENT_OTP: "false"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ${FIREBASE_CREDENTIALS_HOST_PATH:-./secrets/firebase-service-account.json}:/run/secrets/firebase-service-account.json:ro
    networks: [private]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [edge]

volumes:
  bidbook_pg:
  bidbook_redis:
  caddy_data:
  caddy_config:

networks:
  private:
    internal: true
  edge:
